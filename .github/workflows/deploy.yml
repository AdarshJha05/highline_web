name: Deploy site to GitHub Pages

# The live site is hosted on Vercel (see vercel.json), so this does not run on
# push — it would fail on every commit until Pages is enabled. Kept as a
# manual fallback: enable Settings → Pages → Source → GitHub Actions, then
# trigger it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is plain static files — no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
