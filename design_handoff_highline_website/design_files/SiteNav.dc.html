<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Hanken Grotesk',sans-serif}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="display:flex;align-items:center;justify-content:space-between;padding:22px 40px;position:relative;z-index:30;font-family:'Hanken Grotesk',sans-serif">
  <div style="display:flex;align-items:center;gap:4px">
    <a href="About.dc.html" style="{{ aboutS }}">About</a>
    <a href="Home.dc.html#courses" style="{{ coursesS }}">Courses</a>
    <a href="Home.dc.html#blog" style="{{ blogS }}">Blog</a>
    <a href="Contact.dc.html" style="{{ contactS }}">Contact</a>
  </div>
  <a href="Home.dc.html" style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px">
    <span style="width:42px;height:42px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,24,29,.12)"><img src="uploads/highlinebiglogo-Transparent-Copy-150x150.webp" alt="High Line Fire and Safety logo" style="width:32px;height:32px;object-fit:contain"></span>
    <span style="display:flex;flex-direction:column;line-height:1">
      <span style="font-size:17px;font-weight:800;color:#fff;letter-spacing:-.01em">High Line</span>
      <span style="font-size:8px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.24em;margin-top:3px">FIRE &amp; SAFETY</span>
    </span>
  </a>
  <div style="display:flex;align-items:center;gap:10px">
    <div style="display:flex;align-items:center;gap:28px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 16px 10px 20px;color:rgba(255,255,255,.92);font-size:13px;backdrop-filter:blur(8px)">Search here
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.6" stroke="rgba(255,255,255,.9)" stroke-width="1.4"></circle><path d="M9.5 9.5L13 13" stroke="rgba(255,255,255,.9)" stroke-width="1.4" stroke-linecap="round"></path></svg>
    </div>
    <a href="Contact.dc.html" style="background:#fff;color:#14181D;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;transition:background .25s" style-hover="background:#D6E9FA">Get in Touch</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;courses&quot;,&quot;blog&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const mk = k => ({padding: '9px 18px', borderRadius: 999, fontSize: 14, fontWeight: 500, color: a === k ? '#14181D' : '#fff', background: a === k ? '#fff' : 'transparent', transition: 'background .25s'});
    return {aboutS: mk('about'), coursesS: mk('courses'), blogS: mk('blog'), contactS: mk('contact')};
  }
}
</script>
</body>
</html>
